version: '3.8'

services:
  crm_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Point to the CRM database on port 3306 of the host
      - DB_URL=jdbc:mysql://171.254.92.12:3306/crm_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    ports:
      - "8080:8080"
    restart: always

  crm_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the API URL to Vite build
        - VITE_API_BASE_URL=https://crmkhdncto.id.vn/api
    container_name: crm_frontend
    ports:
      - "8001:80"
    depends_on:
      - crm_backend
    restart: always
